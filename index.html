<!-- Objeto animado no background (fixo na rolagem) -->
<div style="
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 870px;
    height: 870px;
    flex-shrink: 0;
    aspect-ratio: 1/1;
    border-radius: 870px;
    background: #0065A9;
    filter: blur(250px);
    animation: kf_120_594_scale_0 2s linear;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    z-index: -1;


"></div>

<style>
@keyframes kf_120_594_scale_0 {
    0% { 
        width: 870px;
        height: 870px;
    }  
    100% { 
        width: 1200px;
        height: 1200px;
    } 
}
</style>
